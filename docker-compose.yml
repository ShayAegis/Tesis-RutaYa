services: 
  api: 
    build: 
      context: ./api
    env_file: 
      - .env 
    restart: always
    expose: 
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
      osrm:
        condition: service_started
  bridge:
    build: 
      context: ./bridge
    env_file:
      - .env
    restart: always
    depends_on:
      - redis
      - mongo
  webapp:
    build:
      context: ./webapp
    env_file:
      - .env
    restart: always
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
  db:
    image: postgis/postgis:latest
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    expose:
      - ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:latest
    restart: always
    expose:
      - ${REDIS_PORT}
  mongo:
    image: mongo:8
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    expose:
      - ${MONGODB_PORT}
    volumes:
      - mongo_data:/data/db
  osrm:
    image: osrm/osrm-backend:latest
    volumes: 
      - ./osrm/data:/data
    expose:
      - "5000"
    command:
      - osrm-routed
      - /data/cucuta.osrm
volumes:
  postgres_data:
  mongo_data:
  


{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/base_styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    {% block styles %}{% endblock %}
    {% block script %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 pt-3 bg-light min-vh-100 d-flex flex-column">
                <div class="d-flex flex-column ms-3 mb-5">
                    <h6>{{ user.empresa }}</h6>
                    <small>{{ user.email }}</small>
                </div>
                <nav class="nav flex-column pt-3">
                    <a class="nav-link text-black {% if request.path == '/paraderos/' %} nav-active {% endif %} me-2" href="/paraderos">
                        <i class="fa-regular fa-circle-dot me-2"></i>
                        Paraderos
                    </a>
                    <a class="nav-link text-black {% if request.path == '/buses/' %} nav-active {% endif %} me-2"
                       href="/buses">
                        <i class="fa-solid fa-bus me-2"></i>
                        Gestión de Flota
                    </a>

                    <a class="nav-link text-black {% if request.path == '/rutas/' %} nav-active {% endif %} me-2"
                       href="/rutas">
                        <i class="fa-solid fa-route me-2"></i>
                        Gestionar Rutas
                    </a>
                    <a class="nav-link text-black {% if request.path == '/rastreadores/' %} nav-active {% endif %} me-2"
                        href="/rastreadores">
                        <i class="fa-solid fa-satellite me-2"></i>
                        Rastreadores
                    </a>
                    <a class="nav-link text-black {% if request.path == '/conductores/' %} nav-active {% endif %} me-2"
                        href="/conductores">
                        <i class="fa-solid fa-id-card me-2"></i>
                        Conductores
                    </a>
                    <a class="nav-link text-black {% if request.path == '/rastreo/' %} nav-active {% endif %} me-2"
                       href="/rastreo/">
                        <i class="fa-solid fa-location-crosshairs me-2"></i>
                        Rastreo en Tiempo Real
                    </a>
                </nav>
                <a class="nav-link text-black mt-auto mb-3 ps-3" href="/logout/">
                    <i class="fa-solid fa-arrow-right-from-bracket me-2"></i>
                    Cerrar Sesión
                </a>
            </div>
            <div class="col-md-10 p-0 d-flex flex-column flex-fill">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
